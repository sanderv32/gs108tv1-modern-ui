<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="default.css" rel="stylesheet">
<script src="rollover.js"></script>
<title>Change Password</title>
</head>
<body class="ui">
<h1>Change Password</h1>
<p class="lead">The password used to log in to this web interface.</p>

<form id="changePassword" name="frm" method="post" action="password.cgi" onsubmit="apply_changePassword();return false">
<section>
  <h2>Password <a class="help" href="javascript:void(0)" onclick="newWindow('changePassword_help.html','','448','336')" title="Help">?</a></h2>
  <dl class="fields">
    <dt><label for="old">Current password</label></dt>
    <dd><input type="password" id="old" name="inputBox_oldPassword" autocomplete="current-password" oninput="enableImage()"></dd>
    <dt><label for="new">New password</label></dt>
    <dd><input type="password" id="new" name="inputBox_newPassword" autocomplete="new-password" oninput="enableImage()"></dd>
    <dt><label for="again">Repeat new password</label></dt>
    <dd><input type="password" id="again" name="inputBox_retypeNewPassword" autocomplete="new-password" oninput="enableImage()"></dd>
  </dl>
</section>
</form>

<script>
var d = document.frm;
function apply_changePassword() {
  if (d.inputBox_newPassword.value != d.inputBox_retypeNewPassword.value) {
    alert("The new passwords do not match.");
    d.inputBox_retypeNewPassword.focus();
    return;
  }
  d.submit();
}
function Cancel() {
  if (!isOn('btn_Cancel')) return;
  document.location.href = "changePassword.html";
}
PaintButtons(CreateEditblBtns('Cancel', 'parent.maincontent.Cancel()', 'btn_Cancel') +
             CreateEditblBtns('Apply', 'parent.maincontent.apply_changePassword()', 'btn_Apply'));
</script>
</body>
</html>
