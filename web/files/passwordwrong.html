<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong password &ndash; Netgear GS108T</title>
<link rel="icon" href="data:,">
<script>(function(){var t="auto";try{t=localStorage.getItem("gs108t-theme")||"auto"}catch(e){}if(t=="auto")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
:root{--bg:#f4f6f9;--surface:#fff;--border:#dde2ea;--text:#1d2533;--muted:#647084;--accent:#2563eb;--accent-dark:#1d4ed8;--error:#b42318;--error-soft:#fef3f2;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
html[data-theme=dark]{color-scheme:dark;--bg:#0f1419;--surface:#171c24;--border:#323b48;--text:#e6e9ef;--muted:#98a2b3;--accent:#5b8cff;--accent-dark:#7aa2ff;--error:#ff8a80;--error-soft:#2d1416}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);padding:28px}
h1{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 22px;color:var(--muted)}
.error{margin:0;padding:10px 12px;border-radius:6px;background:var(--error-soft);color:var(--error);font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;height:38px;margin-top:16px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
.btn:hover{background:var(--accent-dark)}
footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>GS108T</h1>
  <p class="sub">Smart Switch management</p>
  <p class="error">Wrong password. Please try again.</p>
  <a class="btn" id="retry" href="login.html" target="_top">Back to log in</a>
  <footer>Netgear GS108T</footer>
</div>
<script>
document.getElementById("retry").focus();
</script>
</body>
</html>
